<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>음악마블 | Music Marble</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #f4f4f5;
      color: #111827;
    }
    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 16px;
    }

    .board-wrapper {
      position: relative;
      margin: 0 auto 16px;
      max-width: 600px;
      aspect-ratio: 1 / 1;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(7, 1fr);
      gap: 4px;
      width: 100%;
      height: 100%;
      padding: 8px;
      background: #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: relative;
    }

    .tile {
      background-color: #ffffff;
      border-radius: 10px;
      padding: 6px 4px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
      border: 1px solid #e5e7eb;
    }

    .tile-label {
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 2px;
    }
    .tile-composer {
      font-size: 11px;
      color: #374151;
    }
    .tile-index {
      font-size: 9px;
      color: #9ca3af;
      align-self: flex-end;
    }

    .tile.active {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px #2563eb55;
      background-color: #dbeafe;
    }

    .center-title {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .center-title-inner {
      text-align: center;
    }
    .center-main {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 4px;
    }
    .center-sub {
      margin-top: 4px;
      font-size: 12px;
      color: #6b7280;
    }

    .panel {
      background: #ffffff;
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      margin-bottom: 12px;
    }
    .panel-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 4px;
    }
    .btn {
      width: 100%;
      border-radius: 999px;
      padding: 10px 16px;
      border: none;
      background-color: #2563eb;
      color: #f9fafb;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.95; }
    .log {
      font-size: 13px;
      color: #4b5563;
      margin-top: 6px;
    }

    .info-line {
      font-size: 14px;
      margin-bottom: 4px;
    }
    .info-label {
      font-weight: 600;
    }
    .info-desc {
      font-size: 13px;
      color: #4b5563;
      margin-top: 4px;
    }
    .small {
      font-size: 11px;
      color: #6b7280;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🎵 음악마블</h1>
    <div class="subtitle">
      주사위를 굴려 세계 여러 나라의 대표 작곡가 칸을 돌아다니는 음악 보드게임입니다.
    </div>

    <div class="board-wrapper">
      <div id="board" class="board"></div>

      <div class="center-title">

        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">주사위 & 상태</div>

        <div>방문한 나라 수: <span id="visited-count">0</span> / 24</div>
      </div>
      <button id="roll-btn" class="btn">🎲 주사위 굴리기</button>
      <div id="log" class="log">게임을 시작해 보세요!</div>
    </div>

    <div class="panel">
