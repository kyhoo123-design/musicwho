<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>중학생 가창평가 동료평가</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "맑은 고딕", sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      /* 파스텔 그라데이션 배경 */
      background: linear-gradient(135deg, #fdf1ff, #f2f7ff, #fef6e8);
      color: #333;
    }
    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 16px 40px;
    }
    h1, h2 {
      text-align: center;
      margin: 0;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      color: #4a4a7f;
      letter-spacing: 0.03em;
    }
    h2 {
      font-size: 1rem;
      margin-bottom: 18px;
      color: #77779a;
    }

    .tagline {
      text-align: center;
      font-size: 0.86rem;
      color: #8f8fad;
      margin-bottom: 18px;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      padding: 18px 22px;
      border-radius: 18px;
      box-shadow: 0 8px 22px rgba(141, 147, 201, 0.18);
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px);
    }

    .small {
      font-size: 0.92rem;
      color: #55566f;
      line-height: 1.6;
    }

    .label-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }
    .label-row > div {
      flex: 1 1 160px;
      font-size: 0.9rem;
      color: #4f506b;
    }
    .label-row strong {
      display: inline-block;
      min-width: 60px;
    }

    .info-box {
      font-size: 0.88rem;
      background: linear-gradient(135deg, #eef3ff, #f9f2ff);
      border-radius: 14px;
      padding: 10px 12px;
      margin-top: 10px;
      color: #4b4c71;
      border: 1px solid #dde3ff;
    }
    .info-box b {
      color: #454776;
    }

    .rubric-title {
      font-weight: 700;
      font-size: 0.96rem;
      margin-bottom: 8px;
      color: #484a7d;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 0.83rem;
      table-layout: fixed;
    }
    th, td {
      border: 1px solid #e4e6fa;
      padding: 7px 6px;
      text-align: center;
      word-break: keep-all;
    }
    th {
      background: linear-gradient(135deg, #f4f6ff, #fdf5ff);
      font-weight: 600;
      color: #50527b;
    }
