<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>김영후의 음악교실</title>

    <style>
      :root {
        --bg: #050816;
        --accent: #ff6bcb;
        --accent2: #7b5cff;
        --accent3: #00ffd1;
        --card: #0b1220;
        --text-main: #f9fafb;
        --text-sub: #9ca3af;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR",
          system-ui, sans-serif;
        background: radial-gradient(circle at top, #1f2937 0, var(--bg) 55%);
        color: var(--text-main);
        min-height: 100vh;
      }

      /* 앱 전체 프레임(상단 상태바 여백 포함) */
      #app {
        max-width: 480px;         /* 핸드폰 폭 느낌 */
        margin: 0 auto;
        min-height: 100vh;
        background: linear-gradient(180deg, #020617 0%, #020617 40%, #020617 100%);
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
        display: flex;
        flex-direction: column;
      }

      /* 상단 앱바 */
      .app-bar {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        background: linear-gradient(
          90deg,
          rgba(15, 23, 42, 0.95),
          rgba(15, 23, 42, 0.8)
        );
        border-bottom: 1px solid rgba(148, 163, 253, 0.25);
        padding: 10px 18px 8px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .app-bar-logo {
        width: 30px;
        height: 30px;
        border-radius: 12px;
        background: radial-gradient(circle, var(--accent) 0, #1e293b 65%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        box-shadow: 0 0 18px rgba(248, 113, 113, 0.7);
      }

      .app-bar-title {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .app-bar-title h1 {
        font-size: 16px;
        font-weight: 700;
      }

      .app-bar-title span {
        font-size: 11px;
        color: var(--text-sub);
      }

      /* 메인 스크롤 영역 */
      .screen {
        flex: 1;
        overflow-y: auto;
        padding: 16px 16px 24px;
        background:
          radial-gradient(circle at top left, rgba(123, 92, 255, 0.25), transparent 60%),
          radial-gradient(circle at bottom right, rgba(0, 255, 209, 0.25), transparent 60%),
          #020617;
      }

      .profile-card {
        border-radius: 20px;
        padding: 18px 18px 16px;
        background: linear-gradient(
          145deg,
          rgba(15, 23, 42, 0.95),
          rgba(15, 23, 42, 0.9)
        );
        border: 1px solid rgba(148, 163, 253, 0.45);
        box-shadow:
          0 18px 40px rgba(15, 23, 42, 0.9),
          0 0 0 1px rgba(30, 64, 175, 0.3);
        margin-bottom: 14px;
      }

      .profile-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        gap: 10px;
      }

      .profile-name {
        font-size: 18px;
        font-weight: 800;
      }

      .profile-tag {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid rgba(129, 140, 248, 0.7);
        background: rgba(15, 23, 42, 0.9);
        color: #c7d2fe;
      }

      .profile-intro-text {
        font-size: 14px;
        line-height: 1.7;
        color: #e5e7eb;
        margin-bottom: 10px;
      }

      .intro-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
      }

      .chip {
        font-size: 11px;
        padding: 4px 9px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(55, 65, 81, 0.9);
        color: #e5e7eb;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      /* 섹션 공통 */
      .section-title {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .section-title::before {
        content: "";
        width: 4px;
        height: 16px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--accent2), var(--accent3));
      }

      /* 경력 섹션 */
      .career-card {
        border-radius: 18px;
        padding: 14px 14px 10px;
        background: rgba(15, 23, 42, 0.96);
        border: 1px solid rgba(55, 65, 81, 0.9);
      }

      #career-list {
        list-style: none;
        margin-top: 4px;
        padding-left: 0;
      }

      #career-list li {
        position: relative;
        padding: 10px 10px 8px;
        border-radius: 12px;
        background: #020617;
        border: 1px solid rgba(31, 41, 55, 0.9);
        font-size: 13px;
        color: #e5e7eb;
        margin-bottom: 8px;
      }

      #career-list li:last-child {
        margin-bottom: 0;
      }

      .career-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
        font-size: 11px;
        color: var(--text-sub);
      }

      .career-meta span {
        padding: 2px 6px;
        border-radius: 999px;
        background: #020617;
        border: 1px solid rgba(55, 65, 81, 0.9);
      }
