<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>음악 부르마블</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #f4f4f5;
      color: #111827;
    }
    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 16px;
    }
    .top-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .board-card, .control-card {
      flex: 1 1 260px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* 보드 */
    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(60px, 1fr));
      gap: 6px;
      margin-top: 8px;
    }
    .tile {
      border-radius: 12px;
      padding: 8px;
      font-size: 11px;
      background-color: #e5e7eb;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .tile-title {
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .tile-type {
      font-size: 10px;
      color: #4b5563;
    }
    .tile-index {
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 10px;
      color: #9ca3af;
    }
    .tile.quiz {
      background-color: #fef9c3;
    }
    .tile.rest {
      background-color: #e0f2fe;
    }
    .tile.move {
      background-color: #fee2e2;
    }
    .tile.active {
      outline: 2px solid #2563eb;
      box-shadow: 0 0 0 2px #2563eb55;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 10px;
      margin-top: 2px;
      background-color: rgba(15,23,42,0.06);
    }

    /* 컨트롤 */
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .btn {
      border-radius: 999px;
      padding: 10px 16px;
      border: none;
      background-color: #2563eb;
      color: #f9fafb;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn:hover:not(:disabled) {
      opacity: 0.95;
    }
    .log {
      margin-top: 8px;
      font-size: 13px;
      color: #4b5563;
      min-height: 32px;
    }

    /* 퀴즈 영역 */
    .quiz-question {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .quiz-meta {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 6px;
    }
    .quiz-choices {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }
    .quiz-btn {
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      padding: 6px 8px;
      font-size: 13px;
      background-color: #f9fafb;
      cursor: pointer;
      text-align: left;
    }
    .quiz-btn:hover {
      background-color: #e5e7eb;
    }
    .quiz-result {
      font-size: 13px;
      margin-top: 4px;
    }
    .quiz-correct {
      color: #15803d;
    }
    .quiz-wrong {
      color: #b91c1c;
    }
    .small {
      font-size: 11px;
      color: #6b7280;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🎵 음악 부르마블</h1>
    <div class="subtitle">
      주사위를 굴려서 칸을 이동하고, 퀴즈 칸에 도착하면 음악 퀴즈를 풀어보는 보드게임입니다.
    </div>

    <div class="top-row">
      <div class="board-card">
        <div class="card">
          <div class="card-title">게임 보드</div>
          <div id="board" class="board"></div>
          <div class="small">
            노란색 칸: 퀴즈 / 파란색 칸: 휴식 / 빨간색 칸: 앞으로/뒤로 이동  
            파란 테두리가 현재 말의 위치입니다.
          </div>
        </div>
      </div>

      <div class="control-card">
        <div class="card">
          <div class="card-title">주사위 & 상태</div>
          <div class="status-row">
            <div>현재 위치: <span id="position">0</span>번 칸</div>
            <div>점수: <span id="score">0</span>점</div>
          </div>
          <button class="btn" id="roll-btn">🎲 주사위 굴리기</button>
          <div class="log" id="log">주사위를 굴려 게임을 시작하세요.</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">퀴즈 칸에 도착하면?</div>
      <div id="quiz-area">
        <div class="quiz-meta">현재 퀴즈 없음. 퀴즈 칸(노란색)에 도착하면 문제가 나타납니다.</div>
      </div>
    </div>

    <div class="small">
      👉 선생님이 직접 내용을 바꾸고 싶으면, 이 파일 안의
      <code>tiles</code>와 <code>quizData</code> 부분만 수정하면 됩니다.
    </div>
  </div>

  <script>
    // 🔽🔽 보드 칸 설정 (여기만 바꿔도 콘텐츠가 바뀜) 🔽🔽
    const tiles = [
      { title: "START", type: "rest", desc: "출발! 오늘의 음악 여행 시작." },
      { title: "리듬", type: "quiz", key: "rhythm", desc: "리듬 관련 퀴즈" },
      { title: "악기 가족", type: "quiz", key: "instruments", desc: "악기 분류 퀴즈" },
      { title: "쉬어가기", type: "rest", desc: "잠깐 휴식! 아무 일도 일어나지 않아요." },
      { title: "K-POP 세대", type: "quiz", key: "kpop", desc: "세대 비교 감상 퀴즈" },
      { title: "앞으로 2칸", type: "move", move: 2, desc: "추가 이동!" },
      { title: "화성", type: "quiz", key: "harmony", desc: "화성·코드 퀴즈" },
      { title: "쉬어가기", type: "rest", desc: "음악을 떠올리며 숨 고르기." },
      { title: "템포", type: "quiz", key: "tempo", desc: "빠르기 용어 퀴즈" },
      { title: "뒤로 2칸", type: "move", move: -2, desc: "조금 뒤로 돌아가기." },
      { title: "형식", type: "quiz", key: "form", desc: "곡의 형식 퀴즈" },
      { title: "FINISH", type: "rest", desc: "한 바퀴 완주! 축하합니다." }
    ];

    // 퀴즈 데이터: key별로 여러 문제를 둘 수도 있음
    const quizData = {
      rhythm: [
        {
          question: "다음 중 '당김음' 설명으로 가장 알맞은 것은?",
          choices: [
            "강박을 약하게, 약박을 강하게 느끼게 하는 리듬",
            "항상 같은 길이의 음을 반복하는 리듬",
            "점4분음표와 8분음표가 섞인 리듬",
            "빠른 템포에서 사용하는 리듬"
          ],
          answer: 0,
          comment: "당김음은 약박이나 약한 박에 음을 길게 두어 강약의 느낌을 바꾸는 리듬입니다."
        }
      ],
      instruments: [
        {
          question: "다음 중 관악기가 아닌 것은?",
          choices: ["클라리넷", "트롬본", "바순", "마림바"],
          answer: 3,
          comment: "마림바는 음판 타악기(타악기)에 속합니다."
        }
      ],
      kpop: [
        {
          question: "K-POP 세대 비교 감상 수업의 주요 목적은?",
          choices: [
            "최신 아이돌을 소개하기 위해",
            "세대별 음악을 통해 시대·문화의 변화를 이해하기 위해",
            "좋아하는 가수 랭킹을 매기기 위해",
            "부모님을 설득하기 위해"
          ],
          answer: 1,
          comment: "세대별 음악을 통해 각 시대의 정서, 미디어 환경, 사회·문화적 변화를 이해하는 것이 핵심입니다."
        }
      ],
      harmony: [
        {
          question: "다음 중 '코드 진행'을 잘 설명한 것은?",
          choices: [
            "단일 멜로디가 이어지는 것",
            "여러 개의 코드가 일정한 순서로 이어지는 것",
            "오케스트라 편성을 바꾸는 것",
            "리듬 패턴을 반복하는 것"
          ],
          answer: 1,
          comment: "코드 진행은 곡에서 화음(코드)이 차례대로 이어지는 흐름을 말합니다."
        }
      ],
      tempo: [
        {
          question: "다음 중 가장 빠른 빠르기 표시는?",
          choices: ["Andante", "Allegro", "Adagio", "Largo"],
          answer: 1,
          comment: "일반적으로 Allegro가 제시된 보기 중 가장 빠른 빠르기입니다."
        }
      ],
      form: [
        {
          question: "다음 중 'ABA' 형식으로 설명할 수 있는 것은?",
          choices: [
            "한 부분만 계속 반복되는 노래",
            "처음 부분과 비슷한 부분이 마지막에 다시 나오는 노래",
            "완전히 새로운 멜로디만 이어지는 노래",
            "가사만 바뀌고 멜로디는 그대로인 노래"
          ],
          answer: 1,
          comment: "ABA 형식은 처음 부분(A)이 나오고, 다른 부분(B) 후에 다시 A로 돌아오는 구조입니다."
        }
      ]
    };
    // 🔼🔼 여기만 바꾸면 게임 내용을 커스터마이징 가능 🔼🔼

    // 게임 상태
    let position = 0;
    let score = 0;
    const boardEl = document.getElementById("board");
    const posEl = document.getElementById("position");
    const scoreEl = document.getElementById("score");
    const logEl = document.getElementById("log");
    const quizArea = document.getElementById("quiz-area");
    const rollBtn = document.getElementById("roll-btn");

    // 보드 그리기
    function drawBoard() {
      boardEl.innerHTML = "";
      tiles.forEach((tile, index) => {
        const div = document.createElement("div");
        div.className = "tile";
        if (tile.type === "quiz") div.classList.add("quiz");
        if (tile.type === "rest") div.classList.add("rest");
        if (tile.type === "move") div.classList.add("move");

        const indexSpan = document.createElement("div");
        indexSpan.className = "tile-index";
        indexSpan.textContent = index;
        div.appendChild(indexSpan);

        const title = document.createElement("div");
        title.className = "tile-title";
        title.textContent = tile.title;
        div.appendChild(title);

        const type = document.createElement("div");
        type.className = "tile-type";
        let label = "";
        if (tile.type === "quiz") label = "퀴즈 칸";
        if (tile.type === "rest") label = "휴식 칸";
        if (tile.type === "move") {
          label = tile.move > 0 ? `추가 이동 (+${tile.move})` : `뒤로 이동 (${tile.move})`;
        }
        type.textContent = label;
        div.appendChild(type);

        if (tile.desc) {
          const badge = document.createElement("div");
          badge.className = "badge";
          badge.textContent = tile.desc;
          div.appendChild(badge);
        }

        div.dataset.index = index;
        boardEl.appendChild(div);
      });
      updateActiveTile();
    }

    function updateActiveTile() {
      document.querySelectorAll(".tile").forEach(tileEl => {
        tileEl.classList.remove("active");
        const idx = parseInt(tileEl.dataset.index, 10);
        if (idx === position) tileEl.classList.add("active");
      });
      posEl.textContent = position;
    }

    // 주사위 굴리기
    function rollDice() {
      const dice = Math.floor(Math.random() * 6) + 1; // 1~6
      const oldPos = position;
      position = (position + dice) % tiles.length;
      updateActiveTile();

      const tile = tiles[position];
      logEl.textContent = `🎲 ${dice}이(가) 나왔습니다. ${oldPos}번 칸 → ${position}번 칸 (${tile.title})`;

      handleTile(tile);
    }

    function handleTile(tile) {
      // move 칸 처리
      if (tile.type === "move" && tile.move) {
        const before = position;
        let newPos = position + tile.move;
        const len = tiles.length;
        // 음수 보정
        if (newPos < 0) newPos = (newPos % len + len) % len;
        position = newPos % len;
        updateActiveTile();
        logEl.textContent += ` → 추가 이동으로 ${before}번 칸에서 ${position}번 칸으로 이동했습니다.`;
      }

      const current = tiles[position];

      if (current.type === "quiz") {
        showQuiz(current);
      } else if (current.type === "rest") {
        showRest(current);
      } else if (current.type === "move") {
        // 이동 칸에 최종적으로 멈춰 있으면 별도 퀴즈 없음
        quizArea.innerHTML = `
          <div class="quiz-meta">이동 칸에 멈췄습니다. 다음 턴에 다시 주사위를 굴려보세요.</div>
        `;
      }
    }

    function showRest(tile) {
      quizArea.innerHTML = `
        <div class="quiz-meta">[${tile.title}] 휴식 칸입니다.</div>
        <div class="quiz-question">${tile.desc || "잠깐 호흡을 고르고 다음 칸을 준비해요."}</div>
      `;
    }

    function showQuiz(tile) {
      const list = quizData[tile.key];
      if (!list || list.length === 0) {
        quizArea.innerHTML = `
          <div class="quiz-meta">[${tile.title}] 퀴즈 데이터가 아직 없습니다.</div>
        `;
        return;
      }

      // 간단히 첫 번째 문제만 사용 (여러 개 중 랜덤으로 뽑아도 됨)
      const q = list[0];

      const container = document.createElement("div");
      const meta = document.createElement("div");
      meta.className = "quiz-meta";
      meta.textContent = `[${tile.title}] 퀴즈 칸에 도착했습니다. 정답을 골라보세요!`;
      container.appendChild(meta);

      const qText = document.createElement("div");
      qText.className = "quiz-question";
      qText.textContent = q.question;
      container.appendChild(qText);

      const choicesDiv = document.createElement("div");
      choicesDiv.className = "quiz-choices";

      q.choices.forEach((choice, idx) => {
        const btn = document.createElement("button");
        btn.className = "quiz-btn";
        btn.textContent = `${idx + 1}. ${choice}`;
        btn.addEventListener("click", () => {
          checkAnswer(q, idx);
        });
        choicesDiv.appendChild(btn);
      });

      container.appendChild(choicesDiv);

      const resultDiv = document.createElement("div");
      resultDiv.className = "quiz-result";
      resultDiv.id = "quiz-result-text";
      container.appendChild(resultDiv);

      quizArea.innerHTML = "";
      quizArea.appendChild(container);
    }

    function checkAnswer(q, selectedIndex) {
      const resultDiv = document.getElementById("quiz-result-text");
      if (!resultDiv) return;

      if (selectedIndex === q.answer) {
        score += 1;
        scoreEl.textContent = score;
        resultDiv.innerHTML = `<span class="quiz-correct">정답입니다! (+1점)</span> ${q.comment || ""}`;
      } else {
        const correctText = q.choices[q.answer];
        resultDiv.innerHTML = `<span class="quiz-wrong">아惜! 오답입니다.</span> 정답: "${correctText}". ${q.comment || ""}`;
      }
    }

    // 초기화
    drawBoard();
    rollBtn.addEventListener("click", rollDice);
  </script>
</body>
</html>
